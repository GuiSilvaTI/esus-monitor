name: Monitor e-SUS PEC

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # necessário para fazer commit no repositório

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar versão do e-SUS PEC
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check_esus.py

      - name: Salvar versão no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ultima_versao.txt
          # só commita se o arquivo mudou de fato
          git diff --cached --quiet || git commit -m "chore: atualiza versão e-SUS monitorada"
          git push
